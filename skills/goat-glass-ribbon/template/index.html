<!doctype html>
<html lang="mn" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/gsap.min.js"></script>
    <script src="plan.js"></script>
    <script src="goat-lib.js"></script>
    <link rel="stylesheet" href="look.css" />
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1080" data-height="1920">
      <video id="bg" src="main.mp4" data-start="0" data-duration="{{DUR}}" data-media-start="0" data-track-index="0" muted playsinline></video>
      <div id="orbs">
        <span class="orb" style="left: 65px; top: 576px; width: 173px; height: 173px"></span>
        <span class="orb" style="left: 864px; top: 845px; width: 130px; height: 130px"></span>
        <span class="orb" style="left: 713px; top: 461px; width: 76px; height: 76px"></span>
      </div>
      <div id="ribbon">
        <svg viewBox="0 0 1080 1920" aria-hidden="true">
          <defs>
            <linearGradient id="rib" x1="0" x2="1" y1="0" y2="0">
              <stop offset="0" stop-color="#6D28D9" /><stop offset=".55" stop-color="#C084FC" /><stop offset="1" stop-color="#F5EFFF" />
            </linearGradient>
            <filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="18" /></filter>
          </defs>
          <path d="M-60 840 C 220 560, 520 1000, 780 700 S 1080 520, 1160 640" fill="none" stroke="#A855F7" stroke-width="130" stroke-linecap="round" opacity=".45" filter="url(#glow)" />
          <path d="M-60 840 C 220 560, 520 1000, 780 700 S 1080 520, 1160 640" fill="none" stroke="url(#rib)" stroke-width="52" stroke-linecap="round" />
          <path d="M-60 840 C 220 560, 520 1000, 780 700 S 1080 520, 1160 640" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".75" transform="translate(0,-14)" />
        </svg>
      </div>
      <div id="subject">
        <video id="subject-video" src="subject.webm" data-start="0" data-duration="{{DUR}}" data-media-start="0" data-track-index="1" muted playsinline></video>
      </div>
      <div id="cards"></div>
      <div id="pills"></div>
      <div id="scenes"></div>
      <div id="caps"></div>
      <div id="streak"></div>
    </div>
    <script src="look.js"></script>
  </body>
</html>
